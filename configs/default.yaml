# Single source of truth for Fly-By-Wire. Values marked "initial" are tunable.
seed: 0
paths:
  data_dir: ${oc.env:FBW_DATA_DIR,./data}
  runs_dir: ./runs
clocks:
  physics_hz: 200
  sensory_hz: 100          # render + flyvis + core; flyvis dt = 1 / sensory_hz
  control_hz: 25           # actor readout; action held between readouts
env:
  frame_size: 160
  camera_fov_deg: 110
  camera_tilt_deg: 10      # initial; downward FPV tilt, also used by the LPTC flow templates
  episode_seconds: 10
  corridor: {length_m: 30, width_m: 3.0, height_m: 2.5}
  n_obstacles: 8
  obstacle_spacing_m: null # null: spread over the corridor; a number: fixed spacing from x = 4 m (D44)
  wall_texture: none       # none | checker | noise
  obstacle_texture: none   # same choices; a config without the key has none
  renderer: tiny           # auto | egl | tiny; EGL draws shadow-map artefacts here (D29)
vision:
  backend: flyvis          # flyvis | farneback
  flyvis_model: flow/0000/000
  boxeye: {extent: 15, kernel_size: 13}
  cell_types: [T4a, T4b, T4c, T4d, T5a, T5b, T5c, T5d]
  steady_state_seconds: 0.5
lptc:
  channels: [yaw, pitch, roll, forward, lateral, vertical, loom_left, loom_right]
  mode: gains              # frozen | gains | full
  direction_map: null      # path; null -> $FLYVIS_ROOT_DIR/direction_map.json (make calibrate)
connectome:
  source: flywire
  mask_type: real          # real | rewire | er
  min_synapses: 5
  rewire_swaps_per_edge: 10
  groups:                  # glob patterns on the annotation table's type column
    ER:   ["ER*"]
    EPG:  ["EPG*"]
    PEN:  ["PEN*"]
    PEG:  ["PEG*"]
    D7:   ["Delta7*"]
    PFL3: ["PFL3*"]
  flywire:                 # manual Codex download into data/flywire/raw/
    snapshot: 783
    connections_file: connections_princeton.csv
    annotations_file: consolidated_cell_types.csv
    names_file: names.csv    # optional (instance names); "" to skip
    columns:
      pre: pre_root_id
      post: post_root_id
      syn_count: syn_count
      id: root_id
      type: primary_type
      name_id: root_id
      name: name
  input_group: ER
  heading_group: EPG
  actor_group: PFL3
  lesion_groups: [EPG, PEN, D7]
core:
  phi: softplus            # softplus | relu
  alpha_init: 0.2
  w_init_gain: 0.5
  input_dependent_alpha: false
heads:
  log_std_init: -1.5
  ring_wedges: 16
  ring_layout: auto        # anatomical | tuning | auto (anatomical if the EB angles file exists)
  decoder: learned         # learned | anatomical (fixed weights from the EB angle, only gain and bias learned)
action:
  space: body_vel_yawrate  # [v_forward, v_lateral, v_vertical, yaw_rate]
  limits:                  # initial values
    v_forward: [0.0, 2.0]
    v_lateral: [-1.0, 1.0]
    v_vertical: [-0.5, 0.5]
    yaw_rate: [-3.0, 3.0]
reward: {progress: 1.0, heading: 0.3, collision: -100.0, attitude: -0.05, smoothness: -0.01}  # collision was -10 (D43)
expert:                    # scripted expert (privileged state); initial values
  speed: 1.5               # forward-speed target, m/s
  lookahead_m: 3.0
  clearance_m: 0.45        # added to an obstacle's half width when choosing the gap to pass through
  wall_margin_m: 0.35
  influence_m: 0.6         # repulsion range from obstacle and wall surfaces
  repulsion: 0.15
  max_heading_deg: 45
  heading_pid: [2.5, 0.2, 0.15]  # kp, ki, kd: heading error (rad) -> yaw rate (rad/s)
  altitude_gain: 1.0
  wander_deg: 8            # sd of a seeded OU heading wander, for state diversity
  wander_tau_s: 1.0
  exec_noise: null         # DART, only read by collect_expert: {sd: [4, normalised], tau_s, scale: [lo, hi]}
  maneuvers:               # turn on the spot now and then, then back to heading 0; remove for the plain expert
    targets: angles        # angles | uniform: hold a heading drawn from [-180, 180) instead (D42)
    angles_deg: [90, 135, 180, 270, 360]  # excursion size, sign random; 270 and 360 end as full rotations
    wait_s: [1.0, 3.0]     # idle time before the next maneuver may start
    hold_s: [0.0, 1.0]     # pause at the far heading
    peak_rate: 2.5         # rad/s
    accel: 8.0             # rad/s^2
    speed: 0.3             # forward-speed target while turning, m/s
    clear_m: 1.2           # nearest obstacle surface must be farther than this to start
    clear_ahead_m: 2.2     # ... and so must the front of the next obstacle along x
curriculum:                # the dense stage (D44): corridor levels, each a list of overrides on this config
  spaced: [env.obstacle_spacing_m=2.5, env.n_obstacles=9]
  dense: [env.obstacle_spacing_m=2.0, env.n_obstacles=12, expert.speed=1.0, expert.max_heading_deg=65,
          expert.influence_m=0.5]
  slalom: [env.obstacle_spacing_m=1.6, env.n_obstacles=14, expert.speed=1.0, expert.max_heading_deg=65,
           expert.influence_m=0.5]
bc:
  n_trajectories: 300
  batch_episodes: 32
  tbptt_core_steps: 128
  lr: 1.0e-3
  grad_clip: 1.0
  aux_weight: 0.5
  epochs: 50
  pauses: null             # time-freeze pauses in training episodes (D39): {bank: dir, per_episode: n, p: prob}
ppo:
  n_envs: 12
  rollout_decisions: 256
  epochs: 4
  clip: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  lr_actor: 3.0e-5
  lr_critic: 3.0e-4
  critic_warmup_iters: 12  # actor frozen while the critic learns
  kl_anchor_beta: 0.1
  kl_anchor_beta_min: 0.05 # the anchor never goes away entirely
  kl_anchor_decay_updates: 50
  aux_weight: 0.5
  minibatch_envs: 4        # envs per gradient step; each reruns the core over the whole rollout
  tbptt_core_steps: 128
  max_grad_norm: 0.5
  target_kl: 0.03          # stop the epoch loop when the policy moved further than this
  log_std: -2.3            # exploration noise (std 0.1); BC's 0.22 left the action mean worse (D43)
  reward_scale: 0.1        # returns of ~100 would be hard on a small tanh critic
  updates: 400
  save_every: 10
  eval_every: 20           # deterministic flights on held-out seeds; model_best.pt is picked on these
  eval_episodes: 100
  eval_seed: 20000         # validation seeds; the 10000.. test seeds stay unseen
sweep:
  conditions: [real, rewire]
  decoders: [learned]
  seeds: [0, 1, 2]
  max_parallel: 6
logging:
  wandb_mode: offline
